packages:
    - '.'
allowBuilds:
    msw: true
    'unrs-resolver': true
publicHoistPattern:
    - '@inertiajs/core'
supportedArchitectures:
    os:
        - win32
        - darwin
        - current
    cpu:
        - x64
        - arm64

catalog:
    vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
    vitest: 5.1.2
    vite-plus: 1.8.0
overrides:
    vite@*: 'catalog:'

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
    - lucide-react@1.81.0
    - '@types/node@26.6.11'
    - '@types/react@19.3.3'
    - fontaine@1.1.0
