packages:
    - '.'
allowBuilds:
    msw: true
    'unrs-resolver': true
publicHoistPattern:
    - '@inertiajs/core'
supportedArchitectures:
    os:
        - win32
        - darwin
        - current
    cpu:
        - x64
        - arm64

catalog:
    vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
    vitest: 5.1.1
    vite-plus: 1.7.0
overrides:
    vite@*: 'catalog:'

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
    - lucide-react@1.78.0
